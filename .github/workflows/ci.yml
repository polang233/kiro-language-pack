name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The runtime's argv.json editing needs no Kiro install to test, so it runs first:
      # a failure there is the one that could keep an editor from starting.
      - name: Test the runtime and CLI
        run: npm test

      # No Kiro installation is available here, so metadata/kiro.json is absent and
      # the build skips key filtering. The GitHub token raises the API rate limit
      # used by the file listing strategy.
      - name: Sync upstream baseline
        run: npm run sync -- --strategy=api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Includes the VSIX build, bundled assets and tests of the real npm pack output.
      - name: Build VSIX and npm tarball
        run: npm run package:npm

      - name: Validate generated manifests
        run: node scripts/validate-dist.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/*.vsix
            dist/*.tgz
          if-no-files-found: error
          retention-days: 14
